[package]
name = "polyphony"
version = "3.4.1"
description = "复调 Polyphony 桌面端"
edition = "2021"

# debug 构建(APK 侧载场景)剥离 DWARF 调试符号:libpolyphony_lib.so 117MB → ~20MB,
# 整包 126MB → ~30MB(ADR #6 的 debug 直装路线保留,体积代价消除)
[profile.dev]
strip = "debuginfo"

[lib]
name = "polyphony_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 扫码插件仅移动端编入（桌面无原生扫码，走 jsQR+摄像头网页方案）
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2"
