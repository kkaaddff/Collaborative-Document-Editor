<!doctype html>
<html class="light" style="color-scheme: light">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover：Android 15+ edge-to-edge 下 WebView 延伸进状态栏，
         配合各页面根 pt-[env(safe-area-inset-top)] 留出顶部安全区（桌面/浏览器 env=0 无影响） -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" href="/favicon.ico" />
    <!-- 中性占位：首帧 JS 按 locale 覆盖 title 与 lang（i18n/index.tsx） -->
    <title>Polyphony</title>
    <meta name="description" content="Polyphony — realtime collaborative documents (Yjs CRDT), self-hosted, cross-platform" />
  </head>
  <body class="font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
