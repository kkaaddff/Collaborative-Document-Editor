# 协同编辑器 docz 站点：静态前端 + 反代到 WS 后端(8101)
# 由 deploy/remote-restart.sh 覆盖到 openresty 容器的 conf.d/docz.hengheng.online.conf
#
# 拓扑：
#   浏览器 ──http/ws──▶ docz.hengheng.online (80, 本配置, 与其他站点按 server_name 区分)
#   本配置把 /ws(WebSocket)、/upload、/uploads/、/health 转发到 :8101 (PM2 coordination-ws)，
#   其余路径走静态构建产物。
#
# 注意：openresty 容器为 host 网络模式，127.0.0.1 即宿主机，直接代理到 WS 后端。
#
# root 用的是容器内路径；站点 index 经 1Panel bind-mount 映射到
# 宿主机 /opt/1panel/apps/openresty/openresty/www/sites/docz/index
# (即 config.sh 里的 STATIC_DIR，tar 上传的目标)
server {
    listen 80;
    server_name docz.hengheng.online;

    root /www/sites/docz/index;
    index index.html;

    access_log /www/sites/docz/log/access.log main;
    error_log  /www/sites/docz/log/error.log;

    # ---- 协同 WebSocket：前端连 ws://docz.hengheng.online/ws/<room> ----
    # proxy_pass 尾斜杠剥掉 /ws/ 前缀，后端收到 /<room>，房间名仍是房间码本身。
    location /ws/ {
        proxy_pass http://127.0.0.1:8101/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ---- 图片上传接口(后端 multer,multipart,≤5MB)----
    location = /upload {
        proxy_pass http://127.0.0.1:8101;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        client_max_body_size 6m;
    }

    # ---- 已上传图片(后端 multer 静态托管)----
    location /uploads/ {
        proxy_pass http://127.0.0.1:8101;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto http;
    }

    # ---- 健康检查 ----
    location = /health {
        proxy_pass http://127.0.0.1:8101;
        proxy_set_header Host $host;
    }

    # 带哈希的静态构建产物（JS/CSS/字体等）：长期强缓存，内容变即换 hash。
    # 长前缀优先于下面的 /，故不会被误判为 no-cache 反复重下。
    location /_next/static/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Next.js 静态导出: 先按字面路径找文件，再补 .html，再按目录，
    # 最后回退 index.html。$uri.html 是关键 —— 否则 /editor 这类无扩展名
    # 路由会落到空的 editor/ 目录(RSC 预取数据)上，触发 403。
    # 文档/HTML 不缓存，确保每次部署后浏览器立即拿到新版。
    location / {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri $uri.html $uri/ /index.html;
    }

    error_page 404 /404.html;
}
