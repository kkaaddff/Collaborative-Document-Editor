# 全产物构建流水线：一次触发出 Web + 三平台桌面 + Android。
# 触发：手动 workflow_dispatch（默认创建 GitHub Release 挂全产物）/ 推 v* tag。
# Release 标签：推 tag 时用 tag 名；手动触发用 v+tauri.conf.json 版本号（重复触发同版本会覆盖同名附件）。
# 说明：本机无需 Rust/JDK——本地只跑 tsc/eslint/vite build 与收敛冒烟，出包一律走这里。
# 本流水线只在 GitHub 上跑（release 面向公众）；Gitea 侧的 server+Web 部署在
# .gitea/workflows/deploy.yml，各管各的。仓库镜像到 Gitea 时本文件也会被其 Actions
# 读到（推 v* tag 即触发，且 ubuntu-latest 标签在自建 runner 上永远排队），因此 job 级
# 用仓库变量守卫：仅 GitHub 仓配置了 Actions 变量 DEPLOY_ENV=github（Gitea 上不设即跳过）。
# （server_url 守卫不可靠：Gitea 的 DEFAULT_ACTIONS_URL 常默认 github.com。）
name: build

on:
  workflow_dispatch:
    inputs:
      release:
        description: "创建 GitHub Release 并挂全产物（tag = v+版本号）"
        type: boolean
        default: true
  push:
    tags: ["v*"]

permissions:
  contents: write # tag 触发时 tauri-action 需要创建 Release

# CI 侧覆盖回官方源（env 优先级高于仓库 .npmrc）：npmmirror 从海外 runner 拉取不稳，
# 曾致 npm ci 中途崩溃且退出码为 0 → 半残 node_modules。npm 的 replace-registry-host
# 机制会把 lockfile 里的 npmmirror 地址重写为当前 registry，无需双份 lockfile。
env:
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org
  NPM_CONFIG_FETCH_RETRIES: "5"

jobs:
  # ---------- Web（Vite 静态产物，挂 Release 供自托管下载） ----------
  web:
    if: ${{ vars.DEPLOY_ENV == 'github' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: 安装依赖并构建
        working-directory: client
        # npm install 而非 ci：npm 会把 optional 平台原生包按「生成 lockfile 的平台」裁剪，
        # 单平台 lockfile 在其它平台 npm ci 必缺 @rollup/*-gnu/msvc（npm/cli#4828）；
        # install 完整遵循既有锁定版本，仅补当前平台缺失项
        run: |
          npm install --no-audit --no-fund
          npm run build
          # 半残安装兜底：本地 tsc/vite 必须存在（防 PATH 落到系统旧/新工具）
          test -x node_modules/.bin/tsc && test -x node_modules/.bin/vite

      - name: 打包 dist
        run: cd client/dist && zip -r ../web-dist.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: client/web-dist.zip
          if-no-files-found: error

      # Release 标签三处同源：tag 触发用 tag 名；手动勾选 release 用 v+版本号
      - name: 计算 Release 标签
        if: ${{ startsWith(github.ref, 'refs/tags/') || inputs.release == true }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "RELEASE_TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          else
            echo "RELEASE_TAG=v$(node -p "require('./client/src-tauri/tauri.conf.json').version")" >> "$GITHUB_ENV"
          fi

      - name: 挂 web-dist 到 Release
        if: ${{ env.RELEASE_TAG != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$RELEASE_TAG" --title "Polyphony $RELEASE_TAG" \
            --target "$GITHUB_SHA" --notes "CI 自动构建（run ${{ github.run_number }}）" || true
          gh release upload "$RELEASE_TAG" client/web-dist.zip --clobber

  # ---------- 桌面三平台（tauri-action：产物上传；tag 触发时挂 Draft Release） ----------
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest # arm64 runner 原生出 aarch64 dmg（仅 Apple Silicon，不出 Intel）
            args: --target aarch64-apple-darwin --bundles dmg
            rust-targets: aarch64-apple-darwin
            artifact-name: desktop-dmg-aarch64
            artifact-path: client/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          - os: windows-latest
            args: --bundles nsis
            rust-targets: ""
            artifact-name: desktop-nsis-x64
            artifact-path: client/src-tauri/target/release/bundle/nsis/*-setup.exe
          - os: ubuntu-latest # AppImage + deb（托盘需 ayatana 依赖）
            args: --bundles appimage,deb
            rust-targets: ""
            artifact-name: desktop-linux-x64
            artifact-path: |
              client/src-tauri/target/release/bundle/appimage/*.AppImage
              client/src-tauri/target/release/bundle/deb/*.deb
    runs-on: ${{ matrix.os }}
    if: ${{ vars.DEPLOY_ENV == 'github' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri

      - name: 安装 Linux 系统依赖（webkit + 托盘 + 图标）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: 安装前端依赖
        working-directory: client
        run: |
          npm install --no-audit --no-fund   # 同上：补齐本平台 optional 原生包
          test -x node_modules/.bin/tauri

      - name: 计算 Release 标签
        if: ${{ startsWith(github.ref, 'refs/tags/') || inputs.release == true }}
        shell: bash # windows 默认 pwsh，统一 bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "RELEASE_TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          else
            echo "RELEASE_TAG=v$(node -p "require('./client/src-tauri/tauri.conf.json').version")" >> "$GITHUB_ENV"
          fi

      # tauri-action 负责桌面产物挂 Release；无 RELEASE_TAG 时传空 = 跳过上传（由上面的
      # upload-artifact 兜底）。它会自建缺失的 Release，与 web/android 的 gh release create 并发安全
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: client
          args: ${{ matrix.args }}
          tagName: ${{ env.RELEASE_TAG || '' }}
          releaseName: "Polyphony ${{ env.RELEASE_TAG || github.ref_name }}"
          releaseBody: "CI 自动构建（run ${{ github.run_number }}）"
          releaseDraft: false
          prerelease: false

      # 手动触发也必须能下载产物（用户要求：触发即出全套可取回）
      - name: 上传桌面产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error

  # ---------- Android（仅 arm64 单 apk：最新 Android 设备均为 arm64-v8a；v1 debug 签名可直接装机） ----------
  android:
    if: ${{ vars.DEPLOY_ENV == 'github' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # runner 预装 Android SDK/许可；setup-android@v3 反而会因废弃的 tools 包挂掉，不引入
      - name: 确保 NDK 可用并导出 NDK_HOME
        run: |
          if [ -z "${NDK_HOME:-}" ] && ls "$ANDROID_HOME"/ndk/* >/dev/null 2>&1; then
            NDK_DIR=$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1)
            echo "NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
            echo "使用预置 NDK: $NDK_DIR"
          elif [ -z "${NDK_HOME:-}" ]; then
            sdkmanager "ndk;27.0.12077973" >/dev/null
            echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
            echo "已安装 NDK 27.0.12077973"
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri

      - name: 安装前端依赖
        working-directory: client
        run: |
          npm install --no-audit --no-fund   # 同上：补齐本平台 optional 原生包
          test -x node_modules/.bin/tauri

      - name: 生成 Android 工程（gen/android 不入库）
        working-directory: client
        run: |
          npx tauri android init
          node scripts/android-patch.mjs

      # 固定 debug 签名：keystore 存 repo secret（PKCS12, alias androiddebugkey, 口令 android），
      # 跨次构建签名一致 → APK 可原地升级。此前 runner 每次现生成一次性 keystore，
      # 签名互不匹配导致每次发版都必须卸载重装。本地备份：secrets/android-debug.keystore（gitignore）。
      - name: 恢复固定 debug keystore
        env:
          KS_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$KS_B64" | base64 -d > "$HOME/.android/debug.keystore"
            echo "已恢复固定 debug.keystore ($(wc -c < "$HOME/.android/debug.keystore") bytes)"
          else
            echo "::warning::未配置 ANDROID_DEBUG_KEYSTORE_BASE64，将退回一次性签名（APK 无法原地升级）"
          fi

      - name: 构建 apk（仅 arm64）
        working-directory: client
        run: npx tauri android build --apk --target aarch64 --debug

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: client/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: 计算 Release 标签
        if: ${{ startsWith(github.ref, 'refs/tags/') || inputs.release == true }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "RELEASE_TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          else
            echo "RELEASE_TAG=v$(node -p "require('./client/src-tauri/tauri.conf.json').version")" >> "$GITHUB_ENV"
          fi

      - name: 挂 apk 到 Release
        if: ${{ env.RELEASE_TAG != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s globstar nullglob # gh 不展开 glob，** 依赖 globstar
          gh release create "$RELEASE_TAG" --title "Polyphony $RELEASE_TAG" \
            --target "$GITHUB_SHA" --notes "CI 自动构建（run ${{ github.run_number }}）" || true
          gh release upload "$RELEASE_TAG" \
            client/src-tauri/gen/android/app/build/outputs/apk/**/*.apk \
            --clobber
